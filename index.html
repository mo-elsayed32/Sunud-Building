<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunud Building</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1525;--cd:#16203a;--tx:#e8edf7;--mu:#8b97b3;--ln:#26345a;--ac:#e8b04b}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:12px;background:var(--bg);color:var(--tx);font:16px/1.6 Tajawal,system-ui,Tahoma,sans-serif}
h1{font-size:20px;margin:0}h2{font-size:15px;color:var(--mu);margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:#0e1730;border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
button.p,.ch button.on,.ch2 button.on{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #ffffff66}
.t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--ln)}
.t:first-child{border-top:0}.t .n{flex:1;min-width:140px;overflow-wrap:anywhere}
.t.d .n{text-decoration:line-through;color:var(--mu)}
.b{font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:0 6px}
.mu{color:var(--mu);font-size:13px}
.ch button{display:inline-flex;gap:6px;align-items:center}
.crane{opacity:.22;filter:grayscale(1)}.crane.on{opacity:1;filter:none}
.bld{transition:opacity .3s}.bld.idle{opacity:.35;filter:grayscale(1)}
.bc{animation:bk 1s ease-in-out infinite}@keyframes bk{50%{opacity:.25}}
.md{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;border:1px solid var(--ln);border-radius:10px;font-size:14px}
.md i{width:10px;height:10px;border-radius:50%;background:#22c55e;flex:none}.md.idle{color:var(--mu)}.md.idle i{background:var(--mu)}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.wk span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:10px;padding:2px 8px;font-size:13px}.wk span.z{opacity:.4}
.t.ad{border-inline-start:5px solid var(--oc);padding-inline-start:8px}
.t.sf{border:2px solid var(--oc);border-radius:10px;padding-inline:8px;margin:4px 0;background:color-mix(in srgb,var(--oc) 14%,transparent)}
.cl{border:1px solid var(--ac);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.lg2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.lg2 span{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--mu)}.lg2 .s2{background:var(--mu);color:#0e1525}
@media(prefers-reduced-motion:reduce){.bc{animation:none}}
body{padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
button,select,input{min-height:44px}
.nm{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nm button{justify-content:flex-start}
.go{width:100%;margin-top:10px;min-height:48px}
.add{display:flex;gap:8px;margin-bottom:6px}.add input{flex:1;min-width:0}.add button{min-width:48px;font-size:20px;padding:0 14px}
.t{flex-wrap:nowrap}.t .n{min-width:0}.t button{min-width:72px}.t select{width:60px;padding:0 6px;font-size:18px;text-align:center}.t.rr{flex-wrap:wrap}
details.s{margin-top:4px}details.s summary{cursor:pointer;color:var(--mu);min-height:44px;display:flex;align-items:center}
@media(max-width:360px){.add{flex-wrap:wrap}.add input{flex-basis:100%}.add select{flex:1}}
.ch2{display:flex;gap:8px}.ch2 button{flex:1}
.crane.on .hk{animation:sw 5s ease-in-out infinite}
@keyframes sw{50%{transform:translateX(-70px)}}
@media(prefers-reduced-motion:reduce){.crane.on .hk{animation:none}}
</style></head><body>
<div id="lg" class="card">
 <h1>Sunud Building</h1><p></p>
 <div class="nm ch" id="names"></div>
 <input id="code" type="password" placeholder="الرمز" autocomplete="off" style="width:100%;margin-top:10px" onkeydown="if(event.key==='Enter')login()">
 <button class="p go" onclick="login()">دخول</button>
 <p id="le" class="mu" role="alert"></p>
</div>
<div id="mn" hidden>
 <div class="top"><div><h1>Sunud Building</h1><span class="mu" id="who"></span></div><div class="row"><span id="sy" class="mu">●</span><button onclick="out()">خروج</button></div></div>
 <section class="card" id="stg"></section>
 <section class="card" id="rvc" hidden><div id="rv"></div></section>
 <section class="card"><div class="add"><input id="ti" placeholder="المهمة" maxlength="120" onkeydown="if(event.key==='Enter')add()"><select id="ow" aria-label="لمين"></select><button class="p" onclick="add()" aria-label="إضافة">+</button></div><div id="tk"></div></section>
 <section class="card" id="rq" hidden></section>
 <section class="card" id="ad" hidden>
  <details class="s" id="as"><summary>إعدادات</summary>
  <div class="row"><label>مباني/بلوك <input id="c1" type="number" min="1" max="50" style="width:70px"></label><label>بلوكات/مدينة <input id="c2" type="number" min="1" max="50" style="width:70px"></label><button onclick="cfg()">حفظ</button></div>
  <p></p><button onclick="rs=1;draw()">تصفير</button></details></section>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyqxqtRk6KDp-QaaLzoaes_rI3kXp35IAcgzNqZBGkDNJlmKAL2Q_eJX8GdRhDz_YKb/exec';
const W={sayed:['محمّـد السيّد','#3b82f6'],refaat:['محمّـد رفعـت','#22c55e'],karim:['كريـم','#a855f7'],doaa:['دُعَـاء','#f8fafc'],ali:['علي','#facc15']},K=Object.keys(W);
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const nm=k=>W[k][0],co=k=>W[k][1];
let me,code,st,adm,raw='',rs=0,dec={},cf={};
$('names').innerHTML=K.map(k=>`<button id="n_${k}" onclick="pick('${k}')"><i class="dot" style="background:${co(k)}"></i>${nm(k)}</button>`).join('');
$('ow').innerHTML=K.map(k=>`<option value="${k}">${nm(k)}</option>`).join('');
function pick(k){me=k;K.forEach(x=>$('n_'+x).classList.toggle('on',x==k));$('code').focus()}
async function call(a,x={}){
 try{
  $('sy').textContent='…';
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,who:me,code,...x})});
  const j=await r.json();
  if(!j.ok){$('sy').textContent='!';return j}
  adm=j.role==='admin';
  const s=JSON.stringify(j.st);if(s!==raw){raw=s;st=j.st;draw()}
  $('sy').textContent='●';return j;
 }catch(e){$('sy').textContent='✕';return{ok:false,err:'مفيش اتصال'}}
}
const go=async(a,x)=>{const j=await call(a,x);if(!j.ok)alert(j.err);return j};
async function login(){
 if(!me)return $('le').textContent='اختار اسمك';
 code=$('code').value.trim();$('le').textContent='';
 const j=await call('get');
 if(!j.ok)return $('le').textContent=j.err||'حصل خطأ';
 try{localStorage.setItem('sb',JSON.stringify([me,code]))}catch(e){}
 $('lg').hidden=1;$('mn').hidden=0;
 $('who').textContent=nm(me)+(adm?' · أدمن':'');
 $('ow').hidden=!adm;$('ow').value=me;$('ad').hidden=!adm;
 setInterval(()=>{if(!document.hidden)call('get')},15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)call('get')});
}
function out(){try{localStorage.removeItem('sb')}catch(e){}location.reload()}
async function add(){
 const t=$('ti').value.trim();if(!t)return;
 const j=await go('add',{title:t,owner:adm?$('ow').value:me});if(j.ok)$('ti').value='';
}
const dn=id=>go('done',{id}),mv=(id,to)=>go('move',{id,to}),rq=id=>go('req',{id}),rr=(id,ok)=>go('res',{id,ok});
const cfg=()=>go('cfg',{bpb:+$('c1').value,bpc:+$('c2').value});
const dc=(id,v)=>{dec[id]=v;draw()};
async function fin(){
 if(!confirm('تقفل المبنى؟'))return;
 const j=await go('reset',{dec});
 if(j.ok){rs=0;dec={};cf={};draw()}
}
function svg(f,o){
 const fc=f.map(x=>x.c);
 const n=f.length,h=Math.min(18,150/Math.max(n,1)),hy=Math.max(52,220-n*h-16);
 return `<svg viewBox="0 0 300 240" style="width:100%;display:block"><rect x="20" y="222" width="260" height="4" rx="2" fill="#26345a"/><rect x="80" y="60" width="120" height="160" rx="3" fill="none" stroke="#3a4a78" stroke-dasharray="5 4"/>`+
 `<g class="bld${o?'':' idle'}">`+f.map((x,i)=>{const y=220-(i+1)*h,w=h>=10?[92,132,172].map(wx=>`<rect x="${wx}" y="${y+4}" width="26" height="${h-10}" rx="1" ${x.a?'fill="none" stroke="#0e1525" stroke-width="1.5"':'fill="#0e1525" fill-opacity=".75"'}/>`).join(''):'';return `<rect x="80" y="${y}" width="120" height="${h-2}" rx="2" fill="${x.c}"/>`+w}).join('')+`</g>`+
 `<g class="crane${o?' on':''}"><rect x="228" y="36" width="8" height="186" fill="#e8b04b"/><rect x="90" y="36" width="160" height="6" fill="#e8b04b"/><rect x="236" y="30" width="20" height="14" fill="#8b97b3"/>${o?'<circle class="bc" cx="232" cy="30" r="4" fill="#ef4444"/>':''}<g class="hk"><line x1="180" y1="42" x2="180" y2="${hy}" stroke="#cfd6e6"/><rect x="174" y="${hy}" width="12" height="8" fill="#e8b04b"/></g></g></svg>`;
}
function sky(cl,per,c){
 const s=Math.floor(cl/per)*per;if(cl<=s)return'';
 const bs=[];for(let k=s+1;k<=cl;k++)bs.push(st.tasks.filter(t=>t.b===k&&t.s==='done').sort((a,b)=>a.d-b.d));
 const m=Math.max(1,...bs.map(a=>a.length)),h=Math.min(5,46/m);let x=0,r='';
 bs.forEach((a,i)=>{if(i&&i%c.bpb===0)x+=10;a.forEach((t,j)=>r+=`<rect x="${x}" y="${50-(j+1)*h}" width="12" height="${h-1}" fill="${co(t.owner)}"/>`);x+=16});
 return `<div style="overflow-x:auto;margin-top:10px"><svg viewBox="0 0 ${x} 52" style="height:52px;min-width:${x}px;display:block">${r}</svg></div>`;
}
function rpanel(op){
 const all=op.every(t=>dec[t.id]);
 return '<h2>المبنى '+st.cur+'</h2>'+op.map(t=>`<div class="t rr"><div class="n">${E(t.title)}<div class="mu">${nm(t.owner)}</div></div><div class="ch2"><button class="${dec[t.id]=='carry'?'on':''}" onclick="dc(${t.id},'carry')">للجاي</button><button class="${dec[t.id]=='cancel'?'on':''}" onclick="dc(${t.id},'cancel')">إلغاء</button></div></div>`).join('')+
 `<div class="ch2" style="margin-top:10px"><button class="p" ${all?'':'disabled'} onclick="fin()">تصفير</button><button onclick="rs=0;dec={};cf={};draw()">رجوع</button></div>`;
}
function draw(){
 const c=st.cfg,cur=st.cur,cl=cur-1,per=c.bpb*c.bpc,ic=cl%per,cities=Math.floor(cl/per);
 const mine=st.tasks.filter(t=>t.b===cur),d=mine.filter(t=>t.s==='done').sort((a,b)=>a.d-b.d),op=mine.filter(t=>t.s==='open');
 $('stg').innerHTML=`<div class="md ${op.length?'':'idle'}" role="status"><i></i>${op.length?`${op.length} مفتوحة`:'واقف'}</div>`+svg(d.map(t=>({c:co(t.owner),a:t.by==='admin'})),op.length)+
  `<div class="row" style="justify-content:space-between"><b>المبنى ${cur}</b><span class="mu">بلوك ${Math.floor(ic/c.bpb)+1}/${c.bpc} · مبنى ${ic%c.bpb+1}/${c.bpb}${cities?` · مدينة ${cities+1}`:''}</span></div>`+sky(cl,per,c)+`<div class="wk">${K.map(k=>{const a=mine.filter(t=>t.owner===k),o=a.filter(t=>t.s==='open').length;return `<span class="${o?'':'z'}"><i class="dot" style="background:${co(k)}"></i>${nm(k)} ${a.length-o}/${a.length}</span>`}).join('')}</div>`+(op.length==0&&d.length?`<div class="cl row" style="justify-content:space-between"><span>خلصت</span>${adm?'<button class="p" onclick="rs=1;draw()">قفّل</button>':''}</div>`:'');
 $('tk').innerHTML=[...op,...d].map(t=>{
  const own=t.owner===me,pend=st.reqs.some(r=>r.tid===t.id&&r.to===me);
  return `<div class="t${t.s==='done'?' d':''} ${t.by==='admin'?'ad':'sf'}" style="--oc:${co(t.owner)}"><i class="dot" style="background:${co(t.owner)}"></i><div class="n">${E(t.title)}<div class="mu">${nm(t.owner)}${t.by==='admin'?' <span class="b">أدمن</span>':''}</div></div>`+
  (own?`<button onclick="dn(${t.id})">${t.s==='done'?'تراجع':'✔'}</button>`:'')+
  (adm&&t.s==='open'?`<select onchange="mv(${t.id},this.value)"><option>⇄</option>${K.filter(k=>k!==t.owner).map(k=>`<option value="${k}">${nm(k)}</option>`).join('')}</select>`:'')+
  (!adm&&!own&&t.s==='open'?`<button ${pend?'disabled':''} onclick="rq(${t.id})">${pend?'اتطلبت':'اطلبها'}</button>`:'')+'</div>';
 }).join('')||'<p class="mu">مفيش مهام</p>';
 if(adm){
  $('rq').hidden=!st.reqs.length;
  $('rq').innerHTML=st.reqs.length?'<h2>طلبات</h2>'+st.reqs.map(r=>{const t=st.tasks.find(x=>x.id===r.tid);return `<div class="t"><div class="n">${nm(r.to)} يطلب «${E(t.title)}»</div><button class="p" onclick="rr(${r.id},1)">موافقة</button><button onclick="rr(${r.id},0)">رفض</button></div>`}).join(''):'';
  if(document.activeElement!==$('c1'))$('c1').value=c.bpb;
  if(document.activeElement!==$('c2'))$('c2').value=c.bpc;
  $('rvc').hidden=!rs;$('rv').innerHTML=rs?rpanel(op):'';
 }
}
try{const s=JSON.parse(localStorage.getItem('sb'));if(s){pick(s[0]);$('code').value=s[1];login()}}catch(e){}
</script></body></html>
