<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1525">
<title>Sunud Building</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1525;--cd:#16203a;--cd2:#1b2745;--tx:#e8edf7;--mu:#8b97b3;--ln:#26345a;--ac:#e8b04b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:560px;min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 12px 168px;background:var(--bg);color:var(--tx);font:16px/1.6 Tajawal,system-ui,Tahoma,sans-serif}
h1{font-size:20px;margin:0;line-height:1.2}h2{font-size:15px;color:var(--mu);margin:0 0 10px;font-weight:700}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:#0e1730;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;min-height:44px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p,.on{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #ffffff66}
/* login */
.nm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}.nm button{display:flex;gap:8px;align-items:center;justify-content:flex-start}
.go{width:100%;margin-top:10px;min-height:48px}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);min-height:44px}
.me b{font-size:14px}.me .ad{color:var(--ac);font-size:12px;border:1px solid var(--ac);border-radius:8px;padding:0 6px}
#sy{font-size:11px}
/* scene */
.sc{padding:0;overflow:hidden;position:relative}
.sc svg{display:block;width:100%;height:auto}
.cap{display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px 12px;margin-top:-6px}
.cap .big{font-size:30px;line-height:1;font-weight:700;color:var(--ac)}
.nv{display:flex;gap:6px;align-items:center}.nv button{min-width:44px;padding:0}
.crane{opacity:.25;filter:grayscale(1)}.crane.on{opacity:1;filter:none}
.crane.on .hk{animation:sw 6s ease-in-out infinite}@keyframes sw{50%{transform:translateX(-46px)}}
.bc{animation:bk 1.2s ease-in-out infinite}@keyframes bk{50%{opacity:.25}}
.fl{transform-box:fill-box;transform-origin:bottom}.fl.pop{animation:pop .6s ease-out}@keyframes pop{0%{transform:scaleY(0);opacity:0}60%{transform:scaleY(1.08)}100%{transform:scaleY(1);opacity:1}}
.idle .bld{opacity:.9}
/* members */
.mb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.mb div{min-width:0}.mb .n{font-size:11px;line-height:1.25;color:var(--mu);min-height:28px}.mb .v{font-size:13px;font-weight:700}
.bar{height:6px;border-radius:3px;background:#0e1730;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.mb .z{opacity:.4}
/* tasks */
.t{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;background:var(--cd2);border-radius:12px;border-inline-start:5px solid var(--oc)}
.t .n{flex:1;min-width:0;overflow-wrap:anywhere}.t .mu{display:block}
.t.d .n{text-decoration:line-through;color:var(--mu)}.t.d{opacity:.7}
.dq{color:var(--ac);font-weight:500}.t button{min-width:64px}.t select{width:58px;padding:0 6px;font-size:18px;text-align:center}
.t .ok{min-width:52px;font-size:20px;background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:22px 0}
/* city */
.blk{display:grid;gap:8px;margin-bottom:10px}.br{display:grid;gap:6px}
.tl{padding:4px;border:1px solid var(--ln);border-radius:10px;background:var(--cd2);text-align:center;min-height:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tl svg{width:100%;height:56px}.tl small{font-size:11px;color:var(--mu)}
.tl.cu{border-color:var(--ac)}.tl.fu{opacity:.35}
/* nav + fab */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 12px max(10px,env(safe-area-inset-bottom));pointer-events:none}
.nav>div{pointer-events:auto;display:flex;width:100%;max-width:536px;background:#111b33;border:1px solid var(--ln);border-radius:18px;padding:4px;gap:4px}
.nav button{flex:1;border:0;background:none;color:var(--mu);border-radius:14px;position:relative;font-size:14px}
.nav button.a{background:var(--cd2);color:var(--ac);font-weight:700}
.nav .bd{position:absolute;top:4px;inset-inline-end:18%;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#1a1405;font-size:11px;line-height:18px;font-weight:700;padding:0 4px}
.fab{position:fixed;z-index:6;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-start:max(16px,calc(50% - 264px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1a1405;border:0;font-size:30px;line-height:1;box-shadow:0 6px 20px #0008;padding:0;font-weight:700}
/* sheet + toast */
.shb{position:fixed;inset:0;z-index:9;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;background:var(--cd);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom))}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.ch button{display:inline-flex;gap:6px;align-items:center;min-height:40px}
#ts{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));inset-inline:12px;margin:0 auto;max-width:360px;background:#3a1620;border:1px solid #ef4444;color:#ffd7d7;border-radius:12px;padding:10px 14px;text-align:center}
.ch2{display:flex;gap:8px}.ch2 button{flex:1}
.sm{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.sm span{border:1px solid var(--ln);border-radius:10px;padding:2px 10px;font-size:13px}
.num{width:76px}
@media(min-width:900px){
 body{max-width:1080px;padding-bottom:168px}
 .home{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}.home .l{position:sticky;top:12px}
 .nav>div{max-width:520px}.fab{inset-inline-start:max(16px,calc(50% - 540px))}
 .nm{grid-template-columns:repeat(5,1fr)}#lg{max-width:560px;margin:8vh auto}
}
@media(prefers-reduced-motion:reduce){.bc,.crane.on .hk,.fl.pop{animation:none}.bar i{transition:none}}
</style></head><body>
<div id="lg" class="card">
 <h1>Sunud Building</h1>
 <div class="nm" id="names"></div>
 <input id="code" type="password" placeholder="الرمز" autocomplete="off" style="width:100%" onkeydown="if(event.key==='Enter')login()">
 <button class="p go" onclick="login()">دخول</button>
 <p id="le" class="mu" role="alert"></p>
</div>
<div id="mn" hidden>
 <div class="top"><div class="me" id="me"></div><div class="row"><span id="sy" class="mu">●</span><button onclick="out()">خروج</button></div></div>
 <div id="v"></div>
</div>
<div id="fb"></div><div id="tsw"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyqxqtRk6KDp-QaaLzoaes_rI3kXp35IAcgzNqZBGkDNJlmKAL2Q_eJX8GdRhDz_YKb/exec';
const W={sayed:['محمّـد السيّد','#3b82f6'],refaat:['محمّـد رفعـت','#22c55e'],karim:['كريـم','#a855f7'],doaa:['دُعَـاء','#f8fafc'],ali:['علي','#facc15']},K=Object.keys(W);
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const nm=k=>W[k][0],co=k=>W[k][1];
let me,code,st,adm,raw='',tab='h',viewB=0,sheet=0,rv=0,dec={},busy={},seen=null,tm;
$('names').innerHTML=K.map(k=>`<button id="n_${k}" onclick="pick('${k}')"><i class="dot" style="background:${co(k)}"></i>${nm(k)}</button>`).join('');
function pick(k){me=k;K.forEach(x=>$('n_'+x).classList.toggle('on',x==k));$('code').focus()}
function toast(m){clearTimeout(tm);$('tsw').innerHTML=`<div id="ts" role="alert">${E(m)}</div>`;tm=setTimeout(()=>$('tsw').innerHTML='',3500)}
async function call(a,x={}){
 try{
  $('sy').textContent='…';
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,who:me,code,...x})});
  const j=await r.json();
  if(!j.ok){$('sy').textContent='!';return j}
  adm=j.role==='admin';
  const s=JSON.stringify(j.st);if(s!==raw){raw=s;st=j.st;draw()}
  $('sy').textContent='●';return j;
 }catch(e){$('sy').textContent='✕';return{ok:false,err:'مفيش اتصال'}}
}
const go=async(a,x)=>{const j=await call(a,x);if(!j.ok)toast(j.err||'حصل خطأ');return j};
async function login(){
 if(!me)return $('le').textContent='اختار اسمك';
 code=$('code').value.trim();$('le').textContent='';
 const j=await call('get');
 if(!j.ok)return $('le').textContent=j.err||'حصل خطأ';
 try{localStorage.setItem('sb',JSON.stringify([me,code]))}catch(e){}
 $('lg').hidden=1;$('mn').hidden=0;
 setInterval(()=>{if(!document.hidden)call('get')},15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)call('get')});
}
function out(){try{localStorage.removeItem('sb')}catch(e){}location.reload()}
/* actions: same backend calls and payloads as before */
async function add(){
 const t=$('ti').value.trim();if(!t)return;
 const j=await go('add',{title:t,owner:window.ao||me});if(j.ok){sheet=0;draw()}
}
async function act(f,id,...r){if(busy[id])return;busy[id]=1;draw();try{await f(id,...r)}finally{delete busy[id];draw()}}
const dn=id=>act(i=>go('done',{id:i}),id),mv=(id,to)=>act(i=>go('move',{id:i,to}),id),rq=id=>act(i=>go('req',{id:i}),id);
const rrx=(id,ok)=>{if(busy['r'+id])return;busy['r'+id]=1;draw();go('res',{id,ok}).finally(()=>{delete busy['r'+id];draw()})};
const cfg=()=>go('cfg',{bpb:+$('c1').value,bpc:+$('c2').value});
const dc=(id,v)=>{dec[id]=v;draw()};
const DAY=864e5,dqs=()=>st.tasks.filter(t=>t.dq&&t.s!=='cancelled'),dleft=t=>Math.max(1,Math.ceil((t.dq+7*DAY-Date.now())/DAY));
const dreq=id=>{if(confirm('تطلب مسح المهمة؟ هتتمسح لما الأدمن يوافق أو بعد 7 أيام.'))act(i=>go('dreq',{id:i}),id)},dcan=id=>act(i=>go('dcancel',{id:i}),id),dres=(id,ok)=>act((i,o)=>go('dres',{id:i,ok:o}),id,ok),ddel=id=>{if(confirm('تمسح المهمة نهائيًا؟'))act(i=>go('ddel',{id:i}),id)};
async function fin(){
 if(!confirm('تقفل المبنى وتبدأ اللي بعده؟'))return;
 const j=await go('reset',{dec});
 if(j.ok){rv=0;dec={};viewB=0;draw()}
}
const setTab=t=>{tab=t;sheet=0;draw();scrollTo(0,0)};
const nav=d=>{viewB=Math.min(st.cur,Math.max(1,(viewB||st.cur)+d));if(viewB===st.cur)viewB=0;draw()};
const openB=k=>{viewB=k===st.cur?0:k;tab='h';draw();scrollTo(0,0)};
/* scene: floors come from real tasks of the viewed building */
function scene(ts,live){
 const d=ts.filter(t=>t.s==='done').sort((a,b)=>a.d-b.d),o=ts.filter(t=>t.s==='open'),n=d.length+o.length;
 const GY=232,H=150,h=Math.min(26,H/Math.max(n,1)),top=GY-n*h,doneTop=GY-d.length*h;
 const full=n>0&&!o.length;
 let sky='';for(let i=0;i<9;i++){const x=8+i*40+((i*37)%11),w=22+((i*53)%18),ht=34+((i*29)%46);sky+=`<rect x="${x}" y="${GY-ht}" width="${w}" height="${ht}" fill="#121c36"/>`}
 let stars='';for(let i=0;i<14;i++)stars+=`<circle cx="${(i*97)%340+10}" cy="${(i*53)%90+8}" r="${i%3?0.8:1.3}" fill="#e8edf7" opacity="${.25+(i%4)*.12}"/>`;
 let fl='';
 d.forEach((t,i)=>{const y=GY-(i+1)*h,isNew=seen&&!seen.has(t.id);
  const win=h>=12?[124,162,200].map(wx=>`<rect x="${wx}" y="${y+h*.24}" width="22" height="${h*.5}" rx="1.5" ${t.by==='admin'?'fill="none" stroke="#0e1525" stroke-width="1.4"':'fill="#0e1525" fill-opacity=".7"'}/>`).join(''):'';
  fl+=`<g class="fl${isNew?' pop':''}"><rect x="110" y="${y}" width="140" height="${h-2}" rx="2" fill="${co(t.owner)}"/>${win}</g>`});
 o.forEach((t,i)=>{const y=doneTop-(i+1)*h;fl+=`<rect x="110" y="${y+1}" width="140" height="${h-3}" rx="2" fill="${co(t.owner)}" fill-opacity=".07" stroke="${co(t.owner)}" stroke-opacity=".8" stroke-dasharray="5 4"/>`});
 const scaf=o.length?`<line x1="100" y1="${top}" x2="100" y2="${GY}" stroke="#3a4a78"/><line x1="260" y1="${top}" x2="260" y2="${GY}" stroke="#3a4a78"/>`:'';
 const roof=full?`<rect x="104" y="${top-5}" width="152" height="5" rx="2" fill="#e8b04b"/><rect x="178" y="${top-22}" width="4" height="17" fill="#e8b04b"/><circle cx="180" cy="${top-24}" r="3.5" fill="#e8b04b" class="bc"/>`:'';
 const plot=n?'':`<rect x="110" y="${GY-60}" width="140" height="60" rx="3" fill="none" stroke="#3a4a78" stroke-dasharray="6 5"/>`;
 const act=live&&o.length,hy=Math.max(52,top-26);
 const crane=`<g class="crane${act?' on':''}"><rect x="296" y="36" width="9" height="${GY-36}" fill="#e8b04b"/><rect x="262" y="40" width="24" height="9" fill="#8b97b3"/><rect x="92" y="36" width="214" height="6" fill="#e8b04b"/><rect x="300" y="26" width="26" height="14" rx="2" fill="#8b97b3"/>${act?'<circle class="bc" cx="304" cy="24" r="4" fill="#ef4444"/>':''}<g class="hk"><line x1="206" y1="42" x2="206" y2="${hy}" stroke="#cfd6e6"/><rect x="190" y="${hy}" width="32" height="7" fill="${act?co(o[0].owner):'#e8b04b'}"/></g></g>`;
 return `<svg viewBox="0 0 360 250" role="img" aria-label="المبنى"><rect width="360" height="250" fill="#0b1224"/>${stars}${sky}<rect y="${GY}" width="360" height="18" fill="#0a1020"/><rect x="20" y="${GY}" width="320" height="3" rx="1.5" fill="#26345a"/>${plot}${scaf}<g class="bld">${fl}</g>${roof}${crane}</svg>`;
}
function tile(ts,k,cur){
 const d=ts.filter(t=>t.s==='done').sort((a,b)=>a.d-b.d),o=ts.filter(t=>t.s==='open'),n=d.length+o.length;
 if(!n)return `<svg viewBox="0 0 40 56"><rect x="8" y="14" width="24" height="40" rx="2" fill="none" stroke="#3a4a78" stroke-dasharray="3 3"/></svg>`;
 const h=Math.min(8,40/n);let r='';
 d.forEach((t,i)=>r+=`<rect x="8" y="${54-(i+1)*h}" width="24" height="${h-1}" fill="${co(t.owner)}"/>`);
 o.forEach((t,i)=>r+=`<rect x="8.5" y="${54-(d.length+i+1)*h+.5}" width="23" height="${h-2}" fill="none" stroke="${co(t.owner)}" stroke-dasharray="2 2"/>`);
 return `<svg viewBox="0 0 40 56">${r}<rect x="4" y="54" width="32" height="2" fill="#26345a"/></svg>`;
}
const byB=k=>st.tasks.filter(t=>t.b===k&&t.s!=='cancelled');
function members(ts){
 return `<div class="mb">`+K.map(k=>{const a=ts.filter(t=>t.owner===k),dn=a.filter(t=>t.s==='done').length,p=a.length?Math.round(dn/a.length*100):0;
  return `<div class="${a.length?'':'z'}"><i class="dot" style="background:${co(k)}"></i><div class="n">${nm(k)}</div><div class="v">${a.length?dn+'/'+a.length:'—'}</div><div class="bar"><i style="width:${p}%;background:${co(k)}"></i></div></div>`}).join('')+`</div>`;
}
function tasks(ts,ro){
 const op=ts.filter(t=>t.s==='open'),d=ts.filter(t=>t.s==='done').sort((a,b)=>a.d-b.d);
 if(!ts.length)return `<div class="empty">مفيش مهام</div>`;
 return [...op,...d].map(t=>{
  const own=t.owner===me,pend=st.reqs.some(r=>r.tid===t.id&&r.to===me),b=busy[t.id];
  let a='';
  if(!ro){
   if(own)a=t.s==='done'?`<button ${b?'disabled':''} onclick="dn(${t.id})">تراجع</button>`:`<button class="ok" ${b?'disabled':''} onclick="dn(${t.id})" aria-label="تمّت">✔</button>`;
   if(adm&&t.s==='open')a+=`<select ${b?'disabled':''} aria-label="نقل" onchange="mv(${t.id},this.value)"><option>⇄</option>${K.filter(k=>k!==t.owner).map(k=>`<option value="${k}">${nm(k)}</option>`).join('')}</select>`;
   if(t.dq)a=(adm?`<button class="p" ${b?'disabled':''} onclick="dres(${t.id},1)">مسح</button>`:'')+((own||adm)?`<button ${b?'disabled':''} onclick="${adm&&!own?`dres(${t.id},0)`:`dcan(${t.id})`}">${adm&&!own?'رفض':'إلغاء المسح'}</button>`:'');
   else if(adm)a+=`<button aria-label="مسح" ${b?'disabled':''} onclick="ddel(${t.id})">🗑</button>`;
   else if(own)a+=`<button aria-label="طلب مسح" ${b?'disabled':''} onclick="dreq(${t.id})">🗑</button>`;
   if(!adm&&!own&&t.s==='open')a=`<button ${pend||b?'disabled':''} onclick="rq(${t.id})">${pend?'اتطلبت':'اطلبها'}</button>`;
  }
  return `<div class="t${t.s==='done'?' d':''}" style="--oc:${co(t.owner)}"><div class="n">${E(t.title)}<span class="mu">${nm(t.owner)}${t.dq?` · <b class="dq">بانتظار المسح · ${dleft(t)} يوم</b>`:''}</span></div>${a}</div>`}).join('');
}
function home(){
 const c=st.cfg,cur=st.cur,vb=viewB||cur,ts=byB(vb),live=vb===cur,o=ts.filter(t=>t.s==='open').length,d=ts.length-o;
 const cl=vb-1,per=c.bpb*c.bpc,ic=cl%per,cities=Math.floor(cl/per);
 const state=!ts.length?(live?'واقف':'فاضي'):o?`${o} مفتوحة`:'اكتمل البناء';
 return `<div class="home"><div class="l"><section class="card sc ${o?'':'idle'}">${scene(ts,live)}
  <div class="cap"><div><div class="mu">مبنى ${vb}${live?'':' · مقفول'}</div><div class="big">${state}</div><div class="mu">بلوك ${Math.floor(ic/c.bpb)+1}/${c.bpc} · مبنى ${ic%c.bpb+1}/${c.bpb}${cities?' · مدينة '+(cities+1):''}</div></div>
  <div class="nv"><button onclick="nav(-1)" ${vb<=1?'disabled':''} aria-label="السابق">›</button><button onclick="nav(1)" ${live?'disabled':''} aria-label="التالي">‹</button></div></div></section>
  <section class="card">${members(ts)}</section></div>
  <div class="r"><section class="card">${(st.reqs.length+dqs().length)&&adm?`<div class="row sp" style="margin-bottom:10px"><span>طلبات</span><button class="p" onclick="setTab('s')">${st.reqs.length+dqs().length}</button></div>`:''}${tasks(ts,!live)}</section></div></div>`;
}
function city(){
 const c=st.cfg,cur=st.cur,per=c.bpb*c.bpc,cl=cur-1,base=Math.floor(cl/per)*per,cities=Math.floor(cl/per);
 let rows='';
 for(let r=0;r<c.bpc;r++){let t='';for(let j=0;j<c.bpb;j++){const k=base+r*c.bpb+j+1,ts=byB(k),fu=k>cur;
  t+=`<button class="tl${k===cur?' cu':''}${fu?' fu':''}" ${fu?'disabled':''} onclick="openB(${k})" aria-label="مبنى ${k}">${tile(ts,k)}<small>${k}</small></button>`}
  rows+=`<div class="br" style="grid-template-columns:repeat(${c.bpb},1fr)">${t}</div>`}
 const doneB=Math.max(0,cur-1),tot=st.tasks.filter(t=>t.s==='done').length;
 return `<section class="card"><div class="row sp"><b>مدينة ${cities+1}</b><span class="mu">${cl-base}/${per} مبنى</span></div><div class="sm"><span>${doneB} مبنى مقفول</span><span>${tot} مهمة اتنفذت</span>${cities?`<span>${cities} مدينة مكتملة</span>`:''}</div><div class="blk">${rows}</div></section>`;
}
function settings(){
 const c=st.cfg,ts=byB(st.cur),op=ts.filter(t=>t.s==='open'),dn=ts.filter(t=>t.s==='done').length;
 let h='';
 if(st.reqs.length)h+=`<section class="card"><h2>طلبات النقل</h2>`+st.reqs.map(r=>{const t=st.tasks.find(x=>x.id===r.tid);if(!t)return'';const b=busy['r'+r.id];return `<div class="t" style="--oc:${co(r.to)}"><div class="n">${nm(r.to)} يطلب «${E(t.title)}»<span class="mu">عند ${nm(t.owner)}</span></div><button class="p" ${b?'disabled':''} onclick="rrx(${r.id},1)">موافقة</button><button ${b?'disabled':''} onclick="rrx(${r.id},0)">رفض</button></div>`}).join('')+`</section>`;
 if(dqs().length)h+=`<section class="card"><h2>طلبات المسح</h2>`+dqs().map(t=>{const b=busy[t.id];return `<div class="t" style="--oc:${co(t.owner)}"><div class="n">${E(t.title)}<span class="mu">${nm(t.owner)} · ${dleft(t)} يوم</span></div><button class="p" ${b?'disabled':''} onclick="dres(${t.id},1)">مسح</button><button ${b?'disabled':''} onclick="dres(${t.id},0)">رفض</button></div>`}).join('')+`</section>`;
 h+=`<section class="card"><h2>البناء</h2><div class="row"><label>مباني/بلوك <input id="c1" class="num" type="number" min="1" max="50" value="${c.bpb}"></label><label>بلوكات/مدينة <input id="c2" class="num" type="number" min="1" max="50" value="${c.bpc}"></label><button onclick="cfg()">حفظ</button></div></section>`;
 if(!rv)h+=`<section class="card"><h2>نهاية المبنى ${st.cur}</h2><div class="sm"><span>${dn} مكتملة</span><span>${op.length} مفتوحة</span></div><button class="p" onclick="rv=1;dec={};draw()">مراجعة التصفير</button></section>`;
 else{const all=op.every(t=>dec[t.id]),cr=op.filter(t=>dec[t.id]=='carry').length,ca=op.filter(t=>dec[t.id]=='cancel').length;
  h+=`<section class="card"><h2>تصفير المبنى ${st.cur}</h2><div class="sm"><span>${dn} مكتملة</span><span>${cr} تترحّل</span><span>${ca} تتلغي</span></div>`+
  (op.length?op.map(t=>`<div class="t" style="--oc:${co(t.owner)}"><div class="n">${E(t.title)}<span class="mu">${nm(t.owner)}</span></div><div class="ch2"><button class="${dec[t.id]=='carry'?'on':''}" onclick="dc(${t.id},'carry')">ترحيل</button><button class="${dec[t.id]=='cancel'?'on':''}" onclick="dc(${t.id},'cancel')">إلغاء</button></div></div>`).join(''):'<div class="empty">مفيش مهام مفتوحة</div>')+
  `<div class="ch2" style="margin-top:10px"><button class="p" ${all?'':'disabled'} onclick="fin()">تصفير نهائي</button><button onclick="rv=0;dec={};draw()">رجوع</button></div></section>`}
 return h;
}
function sheetUI(){
 window.ao=window.ao||me;
 return `<div class="shb" onclick="if(event.target===this){sheet=0;draw()}"><div class="sh" role="dialog" aria-label="مهمة جديدة"><div class="row"><input id="ti" placeholder="المهمة" maxlength="120" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')add()"><button class="p" onclick="add()" aria-label="إضافة">+</button></div><div class="ch">${K.map(k=>`<button class="${window.ao==k?'on':''}" onclick="window.ao='${k}';draw()"><i class="dot" style="background:${co(k)}"></i>${nm(k)}</button>`).join('')}</div></div></div>`;
}
function draw(){
 if(!st)return;
 const keep=document.activeElement&&document.activeElement.id==='ti'?$('ti').value:null;
 $('me').innerHTML=`<i class="dot" style="background:${co(me)}"></i><b>${nm(me)}</b>${adm?'<span class="ad">أدمن</span>':''}`;
 if(!adm&&tab==='s')tab='h';
 const v=tab==='c'?city():tab==='s'?settings():home();
 const nb=(k,l,b)=>`<button class="${tab===k?'a':''}" onclick="setTab('${k}')">${l}${b?`<span class="bd">${b}</span>`:''}</button>`;
 $('v').innerHTML=v;
 $('fb').innerHTML=(adm&&tab==='h'&&viewB===0?`<button class="fab" onclick="sheet=1;draw();setTimeout(()=>$('ti')&&$('ti').focus(),30)" aria-label="مهمة جديدة">+</button>`:'')+(sheet&&adm?sheetUI():'')+`<div class="nav"><div>${nb('h','المبنى')}${nb('c','المدينة')}${adm?nb('s','الإعدادات',st.reqs.length+dqs().length):''}</div></div>`;
 if(keep!==null&&$('ti')){$('ti').value=keep;$('ti').focus()}
 seen=new Set(st.tasks.filter(t=>t.s==='done').map(t=>t.id));
}
try{const s=JSON.parse(localStorage.getItem('sb'));if(s){pick(s[0]);$('code').value=s[1];login()}}catch(e){}
</script></body></html>
